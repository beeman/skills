interface:
  default_prompt: "Use $gh-commit to get onto the correct feature branch if needed, derive any new branch name from the actual tracked diff instead of generic commit workflow labels, inspect the tracked diff and branch history, prepare a clean local commit with any required changeset, ask before rewriting history on non-default multi-commit branches, and stop before pushing or opening a PR."
  display_name: "Commit Changes"
  short_description: "Prepare a clean local Git commit"
